name: Deploy to InfinityFree

on:
  push:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Laravel app core (fast)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./
          server-dir: /htdocs/laravel_app/
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            .env
            public/**
            vendor/**
            storage/**
            bootstrap/cache/**
            tests/**
            database/*.sqlite

      - name: Deploy public web root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./public/
          server-dir: /htdocs/
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
